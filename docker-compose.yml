services:
  keycloak:
    build: .
    image: keycloak-custom:26.4
    restart: unless-stopped
    # All Keycloak settings come from .env using Keycloak's own KC_* names
    env_file: .env
    ports:
      - "${KC_HTTP_PORT:-8000}:${KC_HTTP_PORT:-8000}"
    healthcheck:
      # The Keycloak image has no curl, so this uses bash's /dev/tcp on the management port
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
